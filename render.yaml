services:
  - type: web
    name: tzi11
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tzi11-db
          property: connectionString
      - key: APP_MODE
        value: vuln
databases:
  - name: tzi11-db
    plan: free
